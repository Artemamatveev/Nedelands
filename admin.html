<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bittertalen · статистика</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=bittie1">
<style>
/* The owner's overview: only the owner sees it (api/admin.js checks ADMIN_EMAILS), so it is in Russian and works on a phone as well as a computer. The app's Delfts blauw: tin-glaze white, cobalt, oranje as the one accent, round tiles, nearly square controls */
:root{
  --bg:#EEF2FA; --card:#fff; --ink:#14213D; --soft:#56617C; --line:#D6DDEB; --blue:#1F3C96; --fill:#1F3C96; --wash:#E4EBFA;
  --oranje:#C8500C; --good:#21613A; --bad:#C0392B; --r:20px; --rc:4px;
  --lift:0 1px 2px rgba(8,16,40,.06),0 8px 24px rgba(8,16,40,.10);
}
/* The owner overview uses a light palette. */
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1400px;margin:0 auto;padding:24px 24px 64px}
header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 small{color:var(--soft);font-weight:400;font-size:15px;margin-inline-start:8px}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
.sub{color:var(--soft);font-size:13px;margin:0 0 14px}
.grow{flex:1}
button,.btn{font:inherit;font-weight:600;border-radius:var(--rc);padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.btn.main{background:var(--fill);border-color:var(--fill);color:#fff}
button:focus-visible,.btn:focus-visible,input:focus-visible,.scroll:focus-visible{outline:2px solid var(--oranje);outline-offset:2px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:20px 22px;margin-bottom:20px}
.tile.warn{border-inline-start:4px solid var(--oranje)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:16px 18px}
.kpi b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--soft);font-size:13px}
.scroll{overflow-x:auto;position:relative} /* also holds .sr, which would otherwise widen the page */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
/* a grid: every cell with a border and centred, so a number is read under its heading */
th{color:var(--soft);font-weight:600;font-size:13px;line-height:1.25;text-align:center;vertical-align:middle;padding:8px 6px;border:1px solid var(--line);background:#F5F7FC}
td{padding:9px 6px;border:1px solid var(--line);text-align:center;vertical-align:middle;white-space:nowrap}
tbody tr.u{cursor:pointer}
@media (hover:hover){tbody tr.u:hover td{background:var(--wash)}}
tr.open td{background:var(--wash)}
.who button{all:unset;cursor:pointer;display:block}
.who button:focus-visible{outline:2px solid var(--oranje);outline-offset:2px}
.who b{display:block;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.who span{color:var(--soft);font-size:13px}
.muted{color:var(--soft)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:var(--rc);padding:1px 6px;margin:0 4px 3px 0;font-size:13px}
.ok{color:var(--good)} .no{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--line)}
.dot.now{background:var(--good)} .dot.week{background:var(--oranje)}
/* Each chart keeps its own scale and a persistent readout of the selected day. */
:root{--chart:#2F52C0}
.trends{margin-bottom:20px}
.trend-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.trend-head h2{font-size:20px}.trend-head .sub{margin:0}
.period{display:flex;gap:4px;background:var(--wash);padding:4px;border-radius:var(--rc)}
.period button{border:0;background:transparent;min-height:40px;padding:6px 14px}
.period button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px #14213D26;color:var(--blue)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart{margin:0;min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:20px 22px}
.chart .sub{min-height:38px;margin-bottom:12px}
.readout{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}
.readout b{font-size:22px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.plot{display:flex;height:208px;padding-top:22px}
.yax{position:relative;width:36px;flex:none;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:8px;transform:translateY(50%)}
.area{isolation:isolate;position:relative;flex:1;min-width:0}
.area hr{position:absolute;left:0;right:0;margin:0;border:0;border-top:1px solid var(--line)}
.line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;color:var(--chart)}
.line path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.points{position:absolute;inset:0;display:flex;touch-action:pan-y}
.point{flex:1;position:relative;min-width:0;cursor:crosshair}
.point::before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--chart);left:50%;top:var(--y);transform:translate(-50%,-50%);pointer-events:none}
.point[data-missing]::before{display:none}
.point[aria-pressed=true]::before{width:11px;height:11px;background:var(--oranje);border:2px solid var(--card);box-shadow:0 0 0 1px var(--oranje);z-index:2}
.point[aria-pressed=true]::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line);z-index:-1}
.point:focus-visible{outline:2px solid var(--oranje);outline-offset:-1px}
.xax{position:relative;height:42px;margin-inline-start:36px;font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.xax span{position:absolute;top:7px;transform:translateX(-50%);white-space:nowrap;text-align:center}
.xax b{display:block;font-size:12px;font-weight:600;color:var(--ink)}.xax small{display:block;font-size:11px}
.chart-hint{font-size:12px;color:var(--soft);margin:8px 0}
.chart details{margin-top:8px;font-size:13px} summary{cursor:pointer;color:var(--soft)}
.chart details table{margin-top:8px} .chart details td,.chart details th{padding:7px 12px}
.chart details td:first-child{text-align:start}.chart details td:last-child{text-align:end}
.chart details tr.selected td{background:var(--wash)}
.events th:first-child,.events td:first-child{position:sticky;left:0;background:var(--card);text-align:start;z-index:1;box-shadow:1px 0 var(--line)}
.events th:first-child{background:#F5F7FC}
.explanation{margin-top:20px;font-size:13px}.explanation p{margin:10px 0}
@media(max-width:900px){.charts{grid-template-columns:1fr}.chart .sub{min-height:0}}
@media(max-width:600px){
  main{padding:20px 16px 40px}header{flex-wrap:wrap;gap:10px}h1{width:100%;font-size:22px}h1 small{display:block;margin:2px 0 0;overflow-wrap:anywhere;font-size:13px}
  header>.grow:empty{display:none}header>.muted{margin-inline-end:auto;font-size:12px}
  .tile,.chart{padding:18px 16px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi b{font-size:24px}
  .trend-head{gap:10px}.trend-head>div:first-child{width:100%}.charts{gap:16px}.readout b{font-size:21px}
  .tile header input[type=search]{width:100%}.tile header .grow{flex-basis:100%}
  .detail .cols{grid-template-columns:1fr}.plot{height:194px}
}
.days{display:flex;align-items:flex-end;gap:4px;height:90px;margin:8px 0 2px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--soft)}
.days .qa{font-weight:600;color:var(--blue);min-height:14px}
.days i{display:block;width:100%;background:var(--fill);border-radius:2px 2px 0 0;min-height:1px}
.detail td{white-space:normal;background:var(--wash);text-align:start}
.detail .cols{display:grid;grid-template-columns:2fr 1fr;gap:24px;padding:4px 4px 10px}
.msg{max-width:560px;margin:80px auto;text-align:center}
.msg p{color:var(--soft)}
input[type=search]{font:inherit;border:1.5px solid var(--ink);border-radius:var(--rc);padding:7px 10px;background:var(--card);color:var(--ink);width:260px}
code{font-size:13px;background:var(--wash);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<main id="app"><p class="msg">Загружаю…</p></main>
<script src="/lib/supabase-2.117.3.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
// the app's day number (local days since 1970), as in S.tm
const dayNo = (t = Date.now()) => { const d = new Date(t); return Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5); };
const dayLabel = n => new Date(n * 864e5).toLocaleDateString("ru-RU", {day: "numeric", month: "short", timeZone: "UTC"});
const PART = {lz: "Чтение A2", ls: "Аудирование A2", wr: "Письмо A2", sp: "Речь A2", knm: "KNM",
  l1: "Чтение B1", lb: "Аудирование B1", wb: "Письмо B1", sb: "Речь B1"};
const EV = [["open", "Открытия приложения"], ["new", "Первые открытия"], ["home", "Главная"], ["begin", "Перешли в приложение"],
  ["quiz", "Пример вопроса"], ["test", "Стартовый тест"], ["day", "Урок дня"], ["exam", "Экзаменов начато"], ["done", "Экзаменов сдано"]];

function dur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec ? "<1 мин" : "—";
  const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  return h ? `${h} ч ${String(m).padStart(2, "0")} мин` : `${m} мин`;
}
function when(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso), days = dayNo() - dayNo(t), hm = new Date(t).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
  if (days <= 0) return `сегодня ${hm}`;
  if (days === 1) return `вчера ${hm}`;
  if (days < 7) return `${days} дн. назад`;
  return new Date(t).toLocaleDateString("ru-RU", {day: "numeric", month: "short", year: days > 300 ? "numeric" : undefined});
}
const date = iso => iso ? new Date(iso).toLocaleString("ru-RU", {day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"}) : "—";
// study seconds: today, the last 7 days and in all
function time(tm) {
  const t = dayNo(); let today = 0, week = 0, all = 0;
  for (const [k, v] of Object.entries(tm || {})) { const n = +v || 0; all += n; if (+k === t) today += n; if (+k > t - 7) week += n; }
  return {today, week, all};
}

function message(title, text, action) {
  app.innerHTML = `<div class="msg"><h1>${title}</h1><p>${text}</p>${action || ""}</div>`;
}

async function token() {
  const cfg = await fetch("/api/config").then(r => r.ok ? r.json() : {}).catch(() => ({}));
  if (!cfg.url) return {off: true};
  const sb = supabase.createClient(cfg.url, cfg.anon, {auth: {flowType: "pkce", detectSessionInUrl: false, persistSession: true, autoRefreshToken: true}});
  const {data} = await sb.auth.getSession();
  return {token: data.session && data.session.access_token, email: data.session && data.session.user.email};
}

let DATA = null, me = "", open = new Set(), query = "", period = 7;
const selectedDays = {};
const DAILY_SINCE = "2026-11-11";
async function load() {
  const t = await token().catch(() => ({}));
  if (t.off) return message("Аккаунты не настроены", "Без Supabase на сайте нет аккаунтов, и показывать нечего.");
  if (!t.token) return message("Нужно войти", "Войдите в приложение тем аккаунтом, который указан в <code>ADMIN_EMAILS</code>, и вернитесь сюда.",
    `<a class="btn main" href="/oefenen?open=login">Войти</a>`);
  me = t.email || "";
  const r = await fetch("/api/admin", {headers: {authorization: `Bearer ${t.token}`}}).catch(() => null);
  if (!r) return message("Нет связи", "Сервер не ответил. Попробуйте ещё раз.", `<button onclick="location.reload()">Обновить</button>`);
  if (r.status === 403) return message("Нет доступа", `Вы вошли как <b>${esc(me)}</b>. Этот адрес должен быть в переменной <code>ADMIN_EMAILS</code> в Vercel.`);
  if (r.status === 401) return message("Нужно войти", "Сессия закончилась. Войдите в приложение ещё раз.", `<a class="btn main" href="/oefenen?open=login">Войти</a>`);
  if (!r.ok) return message("База не ответила", "Скорее всего, в Supabase ещё нет функции <code>admin_overview</code>: выполните последний блок из <code>supabase/schema.sql</code> в SQL Editor.",
    `<button onclick="location.reload()">Обновить</button>`);
  DATA = await r.json(); DATA.at = new Date(); draw();
}

function kpis(users) {
  const t = dayNo(), seenDay = u => u.seen ? dayNo(Date.parse(u.seen)) : null;
  const today = users.filter(u => seenDay(u) === t).length, week = users.filter(u => seenDay(u) !== null && seenDay(u) > t - 7).length;
  let wk = 0, ans = 0, ex = 0;
  for (const u of users) { wk += time(u.tm).week; ans += time(u.qd).week; for (const p of Object.values(u.res || {})) ex += p.n || 0; }
  const k = (v, l) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="kpis">${k(users.length, "аккаунтов")}${k(today, "занимались сегодня")}${k(week, "занимались за 7 дней")}` +
    `${k(dur(wk), "время занятий за 7 дней")}${k(ans.toLocaleString("ru-RU"), "ответов за 7 дней")}${k(ex, "пробных экзаменов всего")}</div>`;
}

function counts(rows) {
  if (!rows) return `<section class="tile"><h2>Посещения</h2><p class="sub">Таблицы <code>usage_counts</code> нет в базе.</p></section>`;
  const by = {};
  for (const r of rows) {
    const d = by[r.day] = by[r.day] || {};
    const k = r.ev.startsWith("exam_") ? "exam" : r.ev.startsWith("done_") ? "done" : r.ev;
    d[k] = (d[k] || 0) + r.n;
  }
  const days = Object.keys(by).sort().reverse();
  const body = days.map(d => `<tr><td>${new Date(d + "T12:00:00Z").toLocaleDateString("ru-RU", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"})}</td>` +
    EV.map(([k], i) => `<td>${by[d][k] || (i ? "<span class=muted>·</span>" : "0")}</td>`).join("") + `</tr>`).join("");
  return `<section class="tile"><h2>Посещения за 30 дней</h2>
    <p class="sub">Анонимные события, с аккаунтом и без. Это не число людей или устройств: очистка хранилища, другой браузер или повторная отправка могут увеличить счётчик.</p>
    <div class="scroll events" tabindex="0" role="region" aria-label="Посещения по дням"><table><thead><tr><th>День</th>${EV.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead>
    <tbody>${body || `<tr><td colspan="${EV.length + 1}" class="muted">Пока пусто.</td></tr>`}</tbody></table></div></section>`;
}

// Calendar days as date strings, oldest first (today last)
function lastDays(n = 30) { const t = dayNo(), out = []; for (let d = t - n + 1; d <= t; d++) out.push(new Date(d * 864e5).toISOString().slice(0, 10)); return out; }
// A round top for the axis and its step: at most four steps of 1, 2 or 5 times a power of ten
function axis(max) {
  for (let p = 1; ; p *= 10) for (const m of [1, 2, 5]) { const step = m * p; if (max <= step * 4) return {step, top: Math.max(1, Math.ceil(max / step)) * step}; }
}
const chartDate = (d, compact = false) => new Date(d + "T12:00:00Z").toLocaleDateString("ru-RU", compact
  ? {day: "2-digit", month: "2-digit", timeZone: "UTC"}
  : {weekday: "short", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"});
function chart(key, title, sub, pts, full) {
  const {step, top} = axis(Math.max(0, ...pts.map(p => p.v || 0))), ticks = [], last = pts.length - 1;
  for (let t = 0; t <= top; t += step) ticks.push(t);
  const selected = pts.find(p => p.d === selectedDays[key]) || pts[last];
  const value = p => p.v === null ? "Нет данных" : full(p.v);
  const x = i => (i + .5) / pts.length * 100, y = p => (1 - (p.v || 0) / top) * 100;
  let pen = false;
  const path = pts.map((p, i) => {
    if (p.v === null) { pen = false; return ""; }
    const command = pen ? "L" : "M"; pen = true;
    return `${command}${x(i) * 10},${y(p) * 1.8}`;
  }).join(" ");
  const points = pts.map(p => `<div class="point" role="button" tabindex="${p === selected ? 0 : -1}" aria-pressed="${p === selected}" aria-label="${chartDate(p.d)}: ${value(p)}" data-date="${p.d}" data-d="${chartDate(p.d)}" data-v="${value(p)}"${p.v === null ? " data-missing" : ""} style="--y:${y(p)}%"></div>`).join("");
  const indices = pts.length <= 7 ? pts.map((_, i) => i) : [0, Math.round(last / 3), Math.round(last * 2 / 3), last];
  const xs = indices.map(i => {
    const d = new Date(pts[i].d + "T12:00:00Z"), month = d.toLocaleDateString("ru-RU", {month:"short",timeZone:"UTC"}).replace(".", "").slice(0, 3);
    const label = pts.length <= 7 ? `<b>${pts[i].d.slice(-2)}</b><small>${month}</small>` : chartDate(pts[i].d, true);
    return `<span style="left:${x(i)}%">${label}</span>`;
  }).join("");
  const rows = [...pts].reverse().map(p => `<tr data-date="${p.d}" class="${p === selected ? "selected" : ""}"><td>${chartDate(p.d)}</td><td>${value(p)}</td></tr>`).join("");
  return `<figure class="chart" data-chart="${key}"><figcaption><h2>${title}</h2><p class="sub">${sub}</p></figcaption>
    <div class="readout" aria-live="polite" aria-atomic="true"><span>${chartDate(selected.d)}</span><b>${value(selected)}</b></div>
    <div class="plot"><div class="yax" aria-hidden="true">${ticks.map(t => `<span style="bottom:${t / top * 100}%">${t}</span>`).join("")}</div>
    <div class="area" role="group" aria-label="${title}: нажмите или проведите по графику, стрелки влево и вправо">${ticks.map(t => `<hr aria-hidden="true" style="bottom:${t / top * 100}%">`).join("")}
      <svg class="line" viewBox="0 0 1000 180" preserveAspectRatio="none" aria-hidden="true"><path d="${path}"/></svg><div class="points">${points}</div></div></div>
    <div class="xax" aria-hidden="true">${xs}</div>
    <details><summary>Все дни таблицей</summary><table><thead><tr><th>Дата</th><th>Значение</th></tr></thead><tbody>${rows}</tbody></table></details></figure>`;
}
function charts(users) {
  const days = lastDays(period), active = {}, secs = {};
  for (const u of users) {
    const seen = new Set();
    for (const [k, v] of Object.entries(u.tm || {})) { const d = new Date(+k * 864e5).toISOString().slice(0, 10); secs[d] = (secs[d] || 0) + (+v || 0); if (+v > 0) seen.add(d); }
    for (const [k, v] of Object.entries(u.qd || {})) if (+v > 0) seen.add(new Date(+k * 864e5).toISOString().slice(0, 10));
    for (const d of seen) active[d] = (active[d] || 0) + 1;
  }
  const range = days.map(d => new Date(d + "T12:00:00Z"));
  const fmt = new Intl.DateTimeFormat("ru-RU", {day: "numeric", month: "long", year: "numeric", timeZone: "UTC"});
  return `<section class="trends" aria-label="Динамика по дням"><div class="trend-head"><div><h2>Динамика по дням</h2><p class="sub">${fmt.formatRange(range[0], range[range.length - 1])}<br>Сегодня — неполный день</p></div>
    <div class="period" role="group" aria-label="Период графиков">${[7, 30].map(n => `<button data-period="${n}" aria-pressed="${period === n}">${n} дней</button>`).join("")}</div></div>
    <div class="charts">` +
    chart("active", "Активные аккаунты", "Занимались за день · каждый аккаунт один раз", days.map(d => ({d, v: d < DAILY_SINCE ? null : active[d] || 0})), v => `${v} акк.`) +
    chart("study", "Время занятий", "Минут за день · только с аккаунтом", days.map(d => ({d, v: d < DAILY_SINCE ? null : Math.round((secs[d] || 0) / 60)})), v => v ? dur(v * 60) : "0 мин") +
    `</div><p class="chart-hint">Нажмите на график или проведите по нему пальцем — появятся дата и значение каждого дня. Учёт занятий по дням ведётся с 11 ноября 2026 года. Гости без аккаунта в эти графики не входят.</p></section>`;
}

function resChips(res) {
  const e = Object.entries(res || {});
  if (!e.length) return `<span class="muted">—</span>`;
  return e.map(([k, v]) => `<span class="chip" title="последний: ${esc(date(v.at && new Date(v.at).toISOString()))}">${esc(PART[k] || k)} ×${v.n}${v.pc != null ? ` · ${v.pc}%` : ""}</span>`).join("");
}

function detail(u) {
  const t = dayNo(), tm = u.tm || {}, list = [];
  for (let n = t - 13; n <= t; n++) list.push([n, +tm[n] || 0]);
  const max = Math.max(60, ...list.map(x => x[1]));
  const qd = u.qd || {};
  const bars = list.map(([n, s]) => `<div title="${dayLabel(n)}: ${dur(s)}, ответов: ${+qd[n] || 0}"><span>${s >= 60 ? Math.round(s / 60) : ""}</span><i style="height:${s / max * 70}px"></i>${new Date(n * 864e5).getUTCDate()}<b class="qa">${+qd[n] || ""}</b></div>`).join("");
  const res = Object.entries(u.res || {}).map(([k, v]) => `<li>${esc(PART[k] || k)}: ${v.n}×, последний ${v.pc != null ? v.pc + "%" : "—"} (${esc(date(v.at && new Date(v.at).toISOString()))})</li>`).join("");
  const active = Object.values(tm).filter(v => v >= 60).length;
  return `<tr class="detail"><td colspan="12"><div class="cols">
    <div><b>Последние 14 дней</b> <span class="muted">· столбик и число над ним — минуты, синее число под датой — ответы · дней с занятиями всего: ${active}</span><div class="days">${bars}</div></div>
    <div><p><b>Аккаунт создан:</b> ${date(u.created)}<br><b>Последний вход:</b> ${date(u.login)}<br><b>Последняя синхронизация:</b> ${date(u.seen)}<br>
    <b>Вход через:</b> ${esc(u.provider || "—")}</p>${res ? `<b>Пробные экзамены</b><ul>${res}</ul>` : ""}</div></div></td></tr>`;
}

function users(list) {
  const t = dayNo();
  const rows = list.filter(u => !query || `${u.name || ""} ${u.email || ""}`.toLowerCase().includes(query)).map((u, i) => {
    const tt = time(u.tm), qa = time(u.qd), qr = time(u.qr), ans = (u.right || 0) + (u.wrong || 0);
    // answers with the share right: "12 (83%)"
    const share = (n, r) => n ? `${n.toLocaleString("ru-RU")} <span class="${r / n >= .7 ? "ok" : "muted"}">(${Math.round(r / n * 100)}%)</span>` : "—";
    const sd = u.seen ? dayNo(Date.parse(u.seen)) : null, dot = sd === t ? "now" : sd !== null && sd > t - 7 ? "week" : "";
    const key = u.email || String(i), isOpen = open.has(key);
    return `<tr class="u${isOpen ? " open" : ""}" data-k="${esc(key)}">
      <td class="who"><button aria-expanded="${isOpen}"><b>${esc(u.name || "Без имени")}</b><span>${esc(u.email || "")} · ${esc(u.lvl || "A2")}</span></button></td>
      <td><span class="dot ${dot}"></span>${when(u.seen || u.login)}</td>
      <td>${dur(tt.today)}</td><td>${dur(tt.week)}</td><td>${dur(tt.all)}</td>
      <td>${share(qa.today, qr.today)}</td><td>${share(qa.week, qr.week)}</td><td>${share(ans, u.right || 0)}</td>
      <td>${u.items || 0}</td>
      <td style="white-space:normal;min-width:150px">${resChips(u.res)}</td>
      <td>${u.checks7 || 0} / ${u.checks || 0}</td>
      <td>${u.plus ? `<span class="${["active", "trialing"].includes(u.plus) ? "ok" : "muted"}">${esc(u.plus)}</span>` : `<span class="muted">—</span>`}</td></tr>` +
      (isOpen ? detail(u) : "");
  }).join("");
  return `<section class="tile"><header style="margin-bottom:10px"><div class="grow"><h2>Пользователи с аккаунтом</h2>
    <p class="sub" style="margin:0">Те, кто вошёл в аккаунт. Гостей без аккаунта видно только в анонимных посещениях ниже. Нажмите на строку, чтобы увидеть дни.</p></div>
    <input type="search" id="q" placeholder="Имя или e-mail" aria-label="Поиск" value="${esc(query)}"></header>
    <div class="scroll" tabindex="0" role="region" aria-label="Пользователи"><table><thead><tr><th rowspan="2">Кто · уровень</th><th rowspan="2">Последняя активность</th>
    <th colspan="3">Время занятий</th><th colspan="3">Ответы (верно)</th><th rowspan="2">Разных вопросов всего</th>
    <th rowspan="2">Пробные экзамены</th><th rowspan="2">Claude 7 дн / всего</th><th rowspan="2">Plus</th></tr>
    <tr><th>сегодня</th><th>7 дней</th><th>всего</th><th>сегодня</th><th>7 дней</th><th>всего</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="12" class="muted">Никого.</td></tr>`}</tbody></table></div></section>`;
}

function draw() {
  const at = DATA.at.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
  app.innerHTML = `<header><h1>Bittertalen <small>статистика · ${esc(me)}</small></h1><div class="grow"></div>
    <span class="muted">обновлено в ${at}</span><button id="re">Обновить</button><a class="btn" href="/oefenen">В приложение</a></header>
    ${DATA.users.some(u => !("qd" in u)) ? `<section class="tile warn" role="status"><h2>В Supabase старая версия функции admin_overview</h2>
    <p class="sub" style="margin:0">Поэтому ответы «сегодня» и «7 дней» не показываются, хотя приложение их уже считает. Выполните в SQL Editor последний блок из <code>supabase/schema.sql</code> (<code>create or replace function public.admin_overview()</code> …) и нажмите «Обновить».</p></section>` : ""}
    ${kpis(DATA.users)}${charts(DATA.users)}${users(DATA.users)}${counts(DATA.counts)}
    <details class="explanation"><summary>Как считаются показатели</summary><p class="sub">Время — активные минуты в приложении: страница открыта, и человек что-то нажимал за последние 90 секунд (или слушал запись). Время и ответы по дням учитываются с 11 ноября 2026 года и попадают сюда после синхронизации прогресса; «всего» у ответов — за всё время, с первого дня. «Разных вопросов» — сколько разных вопросов человек хоть раз прошёл. Ответы считают и упражнения, и пробные экзамены; повтор вопроса после ошибки в том же раунде не считается.</p></details>`;
  $("re").onclick = load;
  app.querySelectorAll("[data-period]").forEach(button => {
    button.onclick = () => { period = +button.dataset.period; draw(); app.querySelector(`[data-period="${period}"]`).focus({preventScroll: true}); };
  });
  const q = $("q"); q.oninput = () => { query = q.value.trim().toLowerCase(); const pos = q.selectionStart; draw(); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("tr.u").forEach(tr => {
    const flip = () => { const k = tr.dataset.k; open.has(k) ? open.delete(k) : open.add(k); draw(); };
    tr.onclick = flip; // the name is a button too, for the keyboard (a click on it reaches the row)
  });
}
// Full dates stay visible while tapping, scrubbing or navigating with arrow keys.
function selectDay(point) {
  const chart = point.closest(".chart"); selectedDays[chart.dataset.chart] = point.dataset.date;
  if (point.getAttribute("aria-pressed") === "true") return;
  chart.querySelectorAll(".point").forEach(p => { p.tabIndex = p === point ? 0 : -1; p.setAttribute("aria-pressed", p === point); });
  chart.querySelector(".readout span").textContent = point.dataset.d;
  chart.querySelector(".readout b").textContent = point.dataset.v;
  chart.querySelectorAll("tr[data-date]").forEach(row => row.classList.toggle("selected", row.dataset.date === point.dataset.date));
}
const pointOf = e => e.target.closest && e.target.closest(".point");
function pointAt(e) {
  const area = e.target.closest(".points"), r = area?.getBoundingClientRect();
  if (!r) return null;
  const i = Math.min(area.children.length - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * area.children.length)));
  return area.children[i];
}
app.addEventListener("pointerdown", e => { const p = pointAt(e); if (p) { selectDay(p); p.parentElement.setPointerCapture(e.pointerId); } });
app.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) { const p = pointAt(e); if (p) selectDay(p); } });
app.addEventListener("click", e => { const p = pointOf(e); if (p) selectDay(p); });
app.addEventListener("focusin", e => { const p = pointOf(e); if (p) selectDay(p); });
app.addEventListener("keydown", e => {
  const p = pointOf(e), to = p && (e.key === "ArrowLeft" ? p.previousElementSibling : e.key === "ArrowRight" ? p.nextElementSibling : null);
  if (to) { e.preventDefault(); to.focus(); }
  if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selectDay(p); }
});
load();
})();
</script>
</body>
</html>
